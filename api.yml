components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-KEY
    appId:
      type: apiKey
      in: header
      name: X-APP-ID
  schemas:
    PreLossStatus:
      type: string
      enum:
        - Pending
        - Queried
        - In Progress
        - Approved
        - Responded Query

    PreLossComment:
      type: object
      properties:
        prelossCommentId:
          type: string
        staffId:
          type: string
        staffName:
          type: string
        prelossComment:
          type: string

    PreLossQuery:
      type: object
      properties:
        prelossCommentId:
          type: string
        staffId:
          type: string
        staffName:
          type: string
        query:
          type: string
        date:
          type: string
          format: date

    PreLossQueryResponse:
      type: object
      properties:
        response:
          type: string
        queryId:
          type: string

    PreLossVideoLink:
      type: object
      properties:
        prelossVideoLinkId:
          type: string
        staffId:
          type: string
        staffName:
          type: string
        agentEmailAddress:
          type: string
        customerEmailAddress:
          type: string
        otherEmailAddress:
          type: string
        generatedVideoLink:
          type: string

    PreLossPhotoLink:
      type: object
      properties:
        prelossPhotoLinkId:
          type: string
        staffId:
          type: string
        staffName:
          type: string
        agentEmailAddress:
          type: string
        customerEmailAddress:
          type: string
        otherEmailAddress:
          type: string
        generatedPhotoLink:
          type: string

    CustomerPersonal:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum:
            - male
            - female
        phone:
          type: string
          format: phone number
        occupation:
          type: string

    Agent:
      type: object
      properties:
        agentId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum:
            - male
            - female
        phone:
          type: string
          format: phone number
        email:
          type: string
        address:
          type: string

    CompanyCustomer:
      type: object
      properties:
        companyName:
          type: string
        rcNumber:
          type: string
        phone:
          type: string
          format: phone number
        email:
          type: string

    CustomerSanctionListVerification:
      type: object
      properties:
        customerId:
          type: string
        date:
          type: string
          format: date
        nameSearched:
          type: string
        profileUrl:
          type: string
        searchId:
          type: number
        searchedOn:
          type: string
        details:
          type: object

    CustomerIDVerification:
      type: object
      properties:
        customerId:
          type: string
        date:
          type: string
          format: date
        documentNumber:
          type: string
        data:
          type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            nin:
              type: string
            issuedDate:
              type: string
            licenseNo:
              type: string
            dateOfBirth:
              type: string
            expiryDate:
              type: string
            stateOfOrigin:
              type: string
            Photo:
              type: string
        error:
          type: object
          properties:
            message:
              type: string

    Rating:
      type: object
      properties:
        payId:
          type: string
        rating:
          type: number

    Beneficiary:
      type: object
      properties:
        name:
          type: string
        dateOfBirth:
          type: string
          format: date
        relationship:
          type: string
        gender:
          type: string
          enum:
            - male
            - female
        phone:
          type: string
          format: phone number
        email:
          type: string
          format: email
        guardianName:
          type: string
        guardianPhoneNumber:
          type: string
