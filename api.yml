      properties:
        customerId:
          type: string
        motors:
          type: array
          items:
            type: object
            properties:
              motorId:
                type: string

    Document:
      type: object
      properties:
        customerId:
          type: string
        policyName:
          type: string
        policyId:
          type: string
        policyClass:
          type: string
        interests:
          type: array
          items:
            type: object
            properties:
              interestId:
                type: string

    IndividualProtectionDocument:
      type: object
      properties:
        customerId:
          type: string
        policyName:
          type: string
        policyId:
          type: string
        personId:
          type: string
        policyClass:
          type: string
        basic:
          type: object
          properties:
            schema:
              $ref: "#/components/schemas/Rider"
        riders:
          type: array
          items:
            $ref: "#/components/schemas/Rider"
        shares:
          type: array
          items:
            $ref: "#/components/schemas/BeneficiaryShare"
      required:
        - customerId
        - policyName
        - policyId
        - policyClass
        - basic
        - riders
        - shares
        - personId

    IndividualSavingsDocument:
      allOf:
        - $ref: "#/components/schemas/IndividualProtectionDocument"
        - type: object
          properties:
            contribution:
              type: number
      required:
        - contribution

    CargoDocument:
      type: object
      properties:
        customerId:
          type: string
        cargoes:
          type: array
          items:
            type: object
            properties:
              cargoId:
