openapi: "3.0.2"
info:
  title: API for General and Life Insurance Middleware
  version: "1.0"
servers:
  - url: https://live-retail-api.heirsinsurance.com
paths:
  /user/signup:
    post:
      description: create a user with password
      operationId: signUpUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                identity:
                  type: string
                  format: email
                name:
                  type: string
                phone:
                  type: string
                confirmPassword:
                  type: string
      responses:
        "200":
          description: OK
        "409":
          $ref: "#/components/responses/Conflict"

  /user/register:
    post:
      description: create a user without password
      operationId: registerUserWithoutPassword
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identity:
                  type: string
                  format: email
                name:
                  type: string
                phone:
                  type: string
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "409":
          $ref: "#/components/responses/Conflict"

  /user/password:
    post:
      description: create a password for an existing user
      operationId: createPassword
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                confirmPassword:
                  type: string
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /user/reset:
    post:
      description: Reset password by creating a one time password for an existing user
      operationId: resetOtp
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identity:
                  type: string
                  format: email or phone
      responses:
        "200":
          description: OK

  /user/otp:
    post:
      description: create a one time password for an existing user
      operationId: createOTP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identity:
                  type: string
                  format: email or phone
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"

  /user/validate-otp:
    post:
      description: validate a one time password for an existing user
      operationId: validateOTP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identity:
                  type: string
                  format: email or phone
                otp:
                  type: string
                  format: otp
                  maxLength: 6
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"

  /user/validate-otp/payment:
    post:
      description: validate a one time password for an existing user for payment
      operationId: validateOTPforPayment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identity:
                  type: string
                  format: email or phone
                otp:
                  type: string
                  format: otp
                  maxLength: 6
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"

  /user/login:
    post:
      description: Log a user in
      operationId: logUserIn
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identity:
                  type: string
                  format: email or phone
                password:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "404":
          $ref: "#/components/responses/NotFound"

  /user/login/payment:
    post:
      description: Log a user in
      operationId: logUserInPayment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identity:
                  type: string
                  format: email or phone
                password:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "404":
          $ref: "#/components/responses/NotFound"
  /user:
    get:
      description: get a user using JWT
      operationId: getLoggedInUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
                  phone:
                    type: string
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /save/quote-assured/{sumAssured}/{savings}/{dob}/{term}/{frequency}:
      parameters:
        - $ref: "#/components/parameters/SumAssuredParam"
        - $ref: "#/components/parameters/SavingsParam"
        - $ref: "#/components/parameters/DobParam"
        - $ref: "#/components/parameters/TermParam"
        - $ref: "#/components/parameters/FrequencyParam"
      get:
        description: Get Quote for Premium Payment
        operationId: getSaveSumAssuredQuote
        responses:
          "200":
            description: OK
            content:
              application/json:
                schema:
                  type: array
                  items:
                    type: object
                    properties:
                      premium:
                        type: number
                      contribution:
                        type: number
                      frequency:
                        type: string
          "401":
            $ref: "#/components/responses/NotAuthenticated"
          "403":
            $ref: "#/components/responses/NotAuthorized"

  /save/quote-premium/{premium}/{contribution}/{dob}/{term}/{frequency}:
      parameters:
        - $ref: "#/components/parameters/ContributionParam"
        - $ref: "#/components/parameters/PremiumParam"
        - $ref: "#/components/parameters/DobParam"
        - $ref: "#/components/parameters/TermParam"
        - $ref: "#/components/parameters/FrequencyParam"
      get:
        description: Get Quote for Sum Assured
        operationId: getSavePremiumQuote
        responses:
          "200":
            description: OK
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    sumAssured:
                      type: number
                    savings:
                      type: number
          "401":
            $ref: "#/components/responses/NotAuthenticated"
          "403":
            $ref: "#/components/responses/NotAuthorized"

  /heirs3years/quote-assured/{sumAssured}/{dob}/{term}/{frequency}:
    parameters:
      - $ref: "#/components/parameters/SumAssuredParam"
      - $ref: "#/components/parameters/DobParam"
      - $ref: "#/components/parameters/TermParam"
      - $ref: "#/components/parameters/FrequencyParam"
    get:
      description: Get Quote for Premium Payment
      operationId: getHeirs3YearsSumAssuredQuote
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LifePremium"
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
  /heirs3years/quote-premium/{premium}/{dob}/{term}/{frequency}:
      parameters:
        - $ref: "#/components/parameters/PremiumParam"
        - $ref: "#/components/parameters/DobParam"
        - $ref: "#/components/parameters/TermParam"
        - $ref: "#/components/parameters/FrequencyParam"
      get:
        description: Get Quote for Sum Assured
        operationId: getHeirs3YearsPremiumQuote
        responses:
          "200":
            description: OK
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/LifeQuote"
          "401":
            $ref: "#/components/responses/NotAuthenticated"
          "403":
            $ref: "#/components/responses/NotAuthorized"

  /user/is-login-by-password:
      post:
        description: get Log in type for user
        operationId: isPasswordLogin
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  identity:
                    type: string
                    format: email or phone
        responses:
          "200":
            description: OK
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    password:
                      type: boolean
                    exists:
                      type: boolean
  
  /lga:
    get:
      description: Get LGA
      operationId: getLgas
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    lga:
                      type: string
                    lgaId:
                      type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
  /customer/{customerId}:
    parameters:
      - $ref: "#/components/parameters/CustomerIdParam"
    post:
      description: Create a customer with  personal details
      operationId: createCustomer
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPersonal"
            example:
              $ref: "#/components/examples/CustomerPersonal"
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
    patch:
      description: Update customer profile
      operationId: updateCustomer
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  format: phone number
                occupation:
                  type: string
      responses:
        "200":
          description: Modified
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      description: Get customer personal details
      operationId: getCustomerById
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"


  /customer/{customerId}/address:
    parameters:
      - $ref: "#/components/parameters/CustomerIdParam"
    patch:
      description: Create a customer address
      operationId: updateCustomerAddress
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Address"
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /company-customer/{customerId}/address:
    parameters:
      - $ref: "#/components/parameters/CustomerIdParam"
    patch:
      description: Add a company customer address
      operationId: updateCompanyCustomerAddress
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Address"
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /customer/{customerId}/id-card:
    parameters:
      - $ref: "#/components/parameters/CustomerIdParam"
    patch:
      description: Add a customer id card by upload
      operationId: updateCustomerIdCard
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Upload"
      responses:
        "200":
          description: Added
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /customer/{customerId}/validate-id-number/{idNumber}:
    parameters:
      - $ref: "#/components/parameters/CustomerIdParam"
      - $ref: "#/components/parameters/IdNumberParam"
    get:
      description: Validate ID Number
      operationId: validateIdNumber
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Checked
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /customer/{customerId}/id-details:
    parameters:
      - $ref: "#/components/parameters/CustomerIdParam"
    patch:
      description: Add a customer id details by upload
      operationId: updateCustomerIdDetails
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdDetails"
      responses:
        "200":
          description: Added
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /customer/{customerId}/utility-bill:
    parameters:
      - $ref: "#/components/parameters/CustomerIdParam"
    patch:
      description: Create a customer utility bill
      operationId: updateCustomerUtilityBill
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Upload"
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /insured-person/{personId}:
    parameters:
      - $ref: "#/components/parameters/PersonIdParam"
    post:
      description: Create an insured person
      operationId: createInsuredPerson
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPersonal"
            example:
              $ref: "#/components/examples/CustomerPersonal"
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
    put:
      description: Update an insured person
      operationId: updateInsuredPerson
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPersonal"
            example:
              $ref: "#/components/examples/CustomerPersonal"
      responses:
        "200":
          description: Updated
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
    patch:
      description: Add Insured Person's Health Form
      operationId: addHealthFormToInsuredPerson
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthForm"
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      description: Get insured person
      operationId: getInsuredPersonById
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CustomerPersonal"
                  - type: object
                    properties:
                      health:
                        $ref: "#/components/schemas/HealthForm"
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /insured-person/{personId}/photo:
    parameters:
      - $ref: "#/components/parameters/PersonIdParam"
    patch:
      description: Add a photo for insured person by upload/capture
      operationId: updateInsuredPersonPhoto
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Upload"
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /insured-person/{personId}/signature:
    parameters:
      - $ref: "#/components/parameters/PersonIdParam"
    patch:
      description: Add a signature for insured person by upload/capture
      operationId: updateInsuredPersonSignature
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Upload"
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /insured-persons:
    get:
      description: Get insured persons for user
      operationId: getInsuredPersonsByLoggedInUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/CustomerPersonal"
                    - $ref: "#/components/schemas/HealthForm"

        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /beneficiary/{beneficiaryId}:
    parameters:
      - $ref: "#/components/parameters/BeneficiaryIdParam"
    post:
      description: Create an beneficiary person
      operationId: createBeneficiary
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Beneficiary"
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
    get:
      description: Get Beneficiary details
      operationId: getBeneficiaryById
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiary"
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /beneficiaries:
    get:
      description: Get a users registered Beneficiaries
      operationId: getBeneficiariesByLoggedInUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Beneficiary"
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  
  /document/{documentId}/save:
    parameters:
      - $ref: "#/components/parameters/DocumentIdParam"
    post:
      description: Create Term assurance document
      operationId: createSaveDocument
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DeathCover"
                - type: object
                  properties:
                    contribution:
                      type: number
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
    patch:
      description: Add customer to document
      operationId: addCustomerToSaveDocument
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerId"
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
    get:
      description: Get term assurance with premium
      operationId: getSaveDocument
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualSavingsDocument"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"


  /document/{documentId}/heirs3years:
    parameters:
      - $ref: "#/components/parameters/DocumentIdParam"
    post:
      description: Create Term assurance document
      operationId: createHeirs3YearsDocument
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeathCover"
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
    patch:
      description: Add customer to document
      operationId: addCustomerToHeirs3YearsDocument
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerId"
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
    get:
      description: Get term assurance with premium
      operationId: getHeirs3YearsDocument
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualProtectionDocument"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"

  /document/{documentId}/save/beneficiary-share/{beneficiaryId}:
    parameters:
      - $ref: "#/components/parameters/DocumentIdParam"
      - $ref: "#/components/parameters/BeneficiaryIdParam"
    patch:
      description: Add beneficiary share to document
      operationId: addBeneficiaryShareToSaveDocument
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeneficiaryShare"
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
    delete:
      description: Delete beneficiary share from document
      operationId: deleteBeneficiaryShareFromSaveDocument
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/NotAuthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
